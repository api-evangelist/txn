name: TXN
description: TXN (TXN Solutions, Inc.) was a San Francisco consumer spending analytics
  company that captured transactions directly from the credit and debit cards of an
  opt-in research panel, layering demographics and targeted surveys on top to give
  merchants competitive intelligence and share-of-wallet insight. Founded by Alex
  Rampell, Pasha Bitz, and Jonathan Wolf and backed by Andreessen Horowitz, Bloomberg
  Beta, General Catalyst, Homebrew, SV Angel, and Slow Ventures, it is listed as
  exited in the Bloomberg Beta portfolio. As of July 2026 txn.com serves only a
  parked "Launching Soon" page on an Alibaba Cloud host with a self-signed TLS
  certificate — no product, developer, or API surface remains.
